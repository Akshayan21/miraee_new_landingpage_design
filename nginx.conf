server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # gzip text assets
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # Content-hashed assets → cache hard, forever
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # SPA fallback — every unknown path serves index.html (react-router handles it)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached (points at hashed assets)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
