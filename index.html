<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <script>
    // Resolve theme before first paint (avoids flash). Saved choice wins, else default light.
    (function () {
      try {
        var t = localStorage.getItem('miraee-theme');
        if (t !== 'light' && t !== 'dark') t = 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>
  <link rel="icon" type="image/png" href="/src/assets/favicon-180.png" />
  <link rel="apple-touch-icon" href="/src/assets/favicon-180.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://framerusercontent.com https://images.unsplash.com; connect-src 'self' https://script.google.com; frame-ancestors 'none';" />
  <meta name="description"
    content="Miraee — an AI-native corporate travel platform for business travel, expenses, and the personal trips people love." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Cardo:ital,wght@0,400;0,700;1,400&display=swap"
    rel="stylesheet" />
  <title>Miraee — AI-native corporate travel</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
